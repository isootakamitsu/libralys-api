<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173a5e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="公有財産AI診断"><title>公有財産AI健康診断</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f7fa;color:#17202a}header{background:#173a5e;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:12px;opacity:.9}main{max-width:1000px;margin:auto;padding:12px}.panel,.card{background:#fff;border:1px solid #d7dee8;border-radius:14px}.panel{padding:13px;margin-bottom:12px}.filebox{display:block;border:2px dashed #9aabba;border-radius:12px;padding:16px;text-align:center;background:#fafcfe}.filebox input{display:none}button{border:0;border-radius:11px;min-height:46px;padding:10px 14px;font-size:16px;font-weight:700}.primary{background:#173a5e;color:#fff}.secondary{background:#eef2f6;color:#334155}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;background:#eef7ee;color:#245d3d}.status.warn{background:#fff7e6;color:#8b5a00}.status.error{background:#fdecec;color:#922b21}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.card{padding:12px}.label{font-size:11px;color:#667085}.value{font-size:21px;font-weight:800;margin-top:4px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.asset-list{display:grid;gap:8px}.asset{border:1px solid #d7dee8;border-radius:12px;padding:11px}.asset-top{display:flex;justify-content:space-between;gap:8px}.asset-name{font-weight:800;font-size:15px}.meta{font-size:12px;color:#667085;margin-top:3px}.rank{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;border-radius:999px;font-weight:800;font-size:12px}.rA{background:#e8f5e9;color:#256029}.rB{background:#fff8e1;color:#8a5a00}.rC{background:#fff1df;color:#a85e00}.rD{background:#fdecea;color:#9f2f24}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.metric{background:#f7f9fb;border-radius:9px;padding:7px}.metric span{display:block;font-size:10px;color:#667085}.metric b{font-size:12px}.asset button{width:100%;margin-top:9px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{border:1px solid #d7dee8;border-radius:10px;padding:9px}.kv .k{font-size:10px;color:#667085}.kv .v{font-weight:800;margin-top:3px;font-size:14px}.callout{margin-top:10px;background:#f5f8fb;border-left:4px solid #173a5e;padding:10px;border-radius:8px;font-size:13px;line-height:1.6}.small{font-size:11px;color:#667085;line-height:1.5}.hidden{display:none!important}select{font-size:16px;min-height:42px;border:1px solid #d7dee8;border-radius:9px;padding:7px;background:#fff}@media(min-width:720px){.cards{grid-template-columns:repeat(4,1fr)}.asset-list{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><h1>公有財産AI健康診断</h1><p>iPhone / iPad / PC対応｜固定資産台帳.xlsx 直接読込</p></header><main><section class="panel"><label class="filebox" for="xlsxInput"><strong>固定資産台帳.xlsxを選択</strong><div class="small" style="margin-top:5px">iPhoneの「ファイルを選択」からExcelを指定できます。</div><input id="xlsxInput" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></label><div class="actions"><button id="sampleBtn" class="secondary" type="button">サンプルを表示</button><button id="csvBtn" class="secondary" type="button">結果CSVを保存</button></div><div id="status" class="status warn">準備中…</div></section><section class="cards"><div class="card"><div class="label">資産件数</div><div class="value" id="count">0</div></div><div class="card"><div class="label">推定土地価値</div><div class="value" id="landTotal">-</div></div><div class="card"><div class="label">活用ギャップ</div><div class="value" id="gapTotal">-</div></div><div class="card"><div class="label">重点検討</div><div class="value" id="focus">0</div></div></section><section class="panel"><div class="toolbar"><h2>資産一覧</h2><select id="filter"><option value="all">全資産</option><option value="D">D 重点</option><option value="C">C 要精密</option><option value="B">B 要観察</option><option value="A">A 継続</option></select></div><div id="assetList" class="asset-list"></div></section><section id="detailPanel" class="panel hidden"><div class="toolbar"><h2 id="detailName">資産カルテ</h2><span id="detailRank" class="rank"></span></div><div id="detailGrid" class="detail-grid"></div><div id="comment" class="callout"></div><div class="callout"><b>推奨活用方針</b><div id="recommendation" style="margin-top:4px"></div></div></section><section class="panel"><h2>PoCについて</h2><div class="small">本アプリは一次診断用です。推定値は正式な不動産鑑定評価額ではありません。Excelはブラウザ内で解析し、サーバーへのアップロード処理は行いません。</div></section></main><script>(()=>{'use strict';const JP={'資産ID':'asset_id','資産名称':'asset_name','所在地':'address','土地面積㎡':'land_area','建物面積㎡':'building_area','現況用途':'use','築年数':'years_old','年間収入円':'annual_revenue','年間維持管理費円':'annual_cost','緯度':'lat','経度':'lon','推定土地単価円/㎡':'estimated_land_unit_price','行政必要性(1-5)':'admin_need','市場性(1-5)':'marketability','利用効率(1-5)':'utilization','用途地域':'zoning','接道状況':'road','駅距離m':'station_distance'};let raw=[];const $=s=>document.querySelector(s),n=v=>{const x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:0},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),yen=v=>v>=1e8?(v/1e8).toFixed(2)+'億円':v>=1e4?Math.round(v/1e4).toLocaleString()+'万円':Math.round(v).toLocaleString()+'円';function status(msg,type='ok'){const e=$('#status');e.textContent=msg;e.className='status'+(type==='error'?' error':type==='warn'?' warn':'')}function normalizeRows(rows){if(!rows.length)return[];const hs=Object.keys(rows[0]);return rows.map(r=>{const o={};hs.forEach(h=>o[JP[h]||h]=r[h]);return o}).filter(x=>x.asset_name||x.asset_id)}function calc(a){const area=n(a.land_area),land=area*n(a.estimated_land_unit_price),net=Math.max(0,n(a.annual_revenue)-n(a.annual_cost)),income=net>0?net/.05:0,gap=Math.max(0,land-income),gr=land?gap/land:0,admin=Math.min(5,Math.max(1,n(a.admin_need)||3)),market=Math.min(5,Math.max(1,n(a.marketability)||3)),util=Math.min(5,Math.max(1,n(a.utilization)||3)),score=Math.round(gr*45+((market-1)/4)*25+((5-admin)/4)*20+((5-util)/4)*10),rank=score>=70?'D':score>=50?'C':score>=30?'B':'A',reco=rank==='D'?'売却・定期借地・民間提案・PPP等を優先比較':rank==='C'?'精密診断・市場調査・民間サウンディング':rank==='B'?'利用効率・維持費・複合化可能性を継続検証':'原則継続保有・定期的再診断';return {...a,area,land,income,gap,gr,admin,market,util,score,rank,reco}}function render(){const data=raw.map(calc).sort((a,b)=>b.score-a.score),f=$('#filter').value;$('#count').textContent=data.length;$('#landTotal').textContent=yen(data.reduce((s,a)=>s+a.land,0));$('#gapTotal').textContent=yen(data.reduce((s,a)=>s+a.gap,0));$('#focus').textContent=data.filter(a=>['C','D'].includes(a.rank)).length;const shown=data.filter(a=>f==='all'||a.rank===f);$('#assetList').innerHTML=shown.map((a,i)=>`<article class="asset"><div class="asset-top"><div><div class="asset-name">${i+1}. ${esc(a.asset_name||a.asset_id)}</div><div class="meta">${esc(a.use||'用途未入力')}｜${a.area.toLocaleString()}㎡</div></div><span class="rank r${a.rank}">${a.rank}</span></div><div class="metrics"><div class="metric"><span>土地価値</span><b>${yen(a.land)}</b></div><div class="metric"><span>現況価値</span><b>${yen(a.income)}</b></div><div class="metric"><span>ギャップ</span><b>${yen(a.gap)}</b></div></div><button type="button" class="primary detail" data-id="${esc(a.asset_id)}">カルテを見る</button></article>`).join('');document.querySelectorAll('.detail').forEach(b=>b.addEventListener('click',()=>show(data.find(x=>String(x.asset_id)===b.dataset.id))));if(data.length&&$('#detailPanel').classList.contains('hidden'))show(data[0])}function show(a){if(!a)return;$('#detailPanel').classList.remove('hidden');$('#detailName').textContent=a.asset_name||a.asset_id;const rr=$('#detailRank');rr.textContent=a.rank+'｜'+a.score+'点';rr.className='rank r'+a.rank;const vals=[['所在地',a.address||'-'],['現況用途',a.use||'-'],['土地面積',a.area.toLocaleString()+'㎡'],['用途地域',a.zoning||'-'],['駅距離',a.station_distance?Number(a.station_distance).toLocaleString()+'m':'-'],['推定土地価値',yen(a.land)],['現況収益価値',yen(a.income)],['活用ギャップ',yen(a.gap)],['ギャップ率',Math.round(a.gr*100)+'%'],['市場性',a.market+'/5'],['行政必要性',a.admin+'/5'],['利用効率',a.util+'/5']];$('#detailGrid').innerHTML=vals.map(v=>`<div class="kv"><div class="k">${esc(v[0])}</div><div class="v">${esc(v[1])}</div></div>`).join('');$('#comment').innerHTML=`<b>AI一次診断</b><div style="margin-top:4px">活用ギャップ率${Math.round(a.gr*100)}％、市場性${a.market}/5、行政必要性${a.admin}/5、利用効率${a.util}/5として診断しました。</div>`;$('#recommendation').textContent=a.reco}function parseCSV(t){const ls=t.replace(/\r/g,'').trim().split('\n'),h=ls[0].split(',').map(x=>x.trim().replace(/^\ufeff/,''));return ls.slice(1).filter(Boolean).map(line=>{const a=line.split(','),o={};h.forEach((k,i)=>o[k]=a[i]??'');return o})}$('#xlsxInput').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.name.toLowerCase().endsWith('.csv')){raw=normalizeRows(parseCSV(await file.text()));status(`${raw.length}資産をCSVから読み込みました。`);render();return}if(typeof XLSX==='undefined')throw new Error('Excel読込ライブラリを取得できません。');const ab=await file.arrayBuffer(),book=XLSX.read(ab,{type:'array'}),sheet=book.Sheets[book.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:''});raw=normalizeRows(rows);if(!raw.length)throw new Error('資産データを認識できませんでした。');status(`${raw.length}資産をExcelから正常に読み込みました。`);render()}catch(err){status('読込エラー：'+err.message,'error')}});$('#filter').addEventListener('change',render);$('#sampleBtn').addEventListener('click',()=>{raw=SAMPLE.map(x=>({...x}));status('20資産の仮データを表示しています。');render()});$('#csvBtn').addEventListener('click',()=>{const d=raw.map(calc);if(!d.length){status('先に資産データを読み込んでください。','warn');return}const h=['資産ID','資産名称','推定土地価値','現況収益価値','活用ギャップ','ギャップ率%','市場性','行政必要性','利用効率','診断','スコア','推奨方針'],q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s},rows=[h.join(',')].concat(d.map(a=>[a.asset_id,a.asset_name,Math.round(a.land),Math.round(a.income),Math.round(a.gap),(a.gr*100).toFixed(1),a.market,a.admin,a.util,a.rank,a.score,a.reco].map(q).join(','))),blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='公有財産AI健康診断_結果.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});const SAMPLE=[{asset_id:'A001',asset_name:'住道駅周辺市有地',address:'大東市住道2丁目',land_area:4850,use:'暫定駐車場',annual_revenue:12000000,annual_cost:3000000,estimated_land_unit_price:230000,admin_need:2,marketability:5,utilization:2,zoning:'近隣商業地域',station_distance:420},{asset_id:'A004',asset_name:'諸福未利用地A',address:'大東市諸福5丁目',land_area:2200,use:'未利用地',annual_revenue:0,annual_cost:1200000,estimated_land_unit_price:155000,admin_need:1,marketability:4,utilization:1,zoning:'準工業地域',station_distance:900},{asset_id:'A007',asset_name:'浜町駅近市有地B',address:'大東市浜町',land_area:1450,use:'平面駐車場',annual_revenue:7200000,annual_cost:1600000,estimated_land_unit_price:250000,admin_need:2,marketability:5,utilization:3,zoning:'商業地域',station_distance:250},{asset_id:'A015',asset_name:'南郷学校跡地',address:'大東市太子田2丁目',land_area:9800,use:'旧学校',annual_revenue:0,annual_cost:52000000,estimated_land_unit_price:170000,admin_need:3,marketability:4,utilization:1,zoning:'第一種住居地域',station_distance:1200},{asset_id:'A019',asset_name:'住道北側低利用地',address:'大東市赤井2丁目',land_area:1700,use:'低利用地',annual_revenue:1500000,annual_cost:900000,estimated_land_unit_price:245000,admin_need:1,marketability:5,utilization:2,zoning:'商業地域',station_distance:380}];window.addEventListener('load',()=>{status(typeof XLSX==='undefined'?'サンプル利用可。Excel直接読込には通信が必要です。':'Excel直接読込の準備ができました。',typeof XLSX==='undefined'?'warn':'ok');raw=SAMPLE.map(x=>({...x}));render()})})();</script></body></html>
